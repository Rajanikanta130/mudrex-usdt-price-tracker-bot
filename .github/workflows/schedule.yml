name: Mudrex Price Fetcher

on:
  schedule:
    # 4:00 AM UTC is 9:30 AM IST (Runs 30 minutes early, script will sleep until exactly 10:00 AM)
    - cron: '0 4 * * *'
    # 11:30 AM UTC is 5:00 PM IST (Runs 30 minutes early, script will sleep until exactly 5:30 PM)
    - cron: '30 11 * * *'
  # Allows you to run this workflow manually from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  fetch-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SLACK_CHANNEL_EMAIL: ${{ secrets.SLACK_CHANNEL_EMAIL }}
        run: python main.py
