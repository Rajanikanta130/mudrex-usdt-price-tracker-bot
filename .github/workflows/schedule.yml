name: Mudrex Price Fetcher

on:
  schedule:
    # 4:30 AM UTC is 10:00 AM IST
    - cron: '30 4 * * *'
    # 12:00 PM UTC is 5:30 PM IST
    - cron: '0 12 * * *'
  # Allows you to run this workflow manually from the GitHub Actions tab for testing
  workflow_dispatch:
  # Allows you to run this workflow via an external webhook trigger (like cron-job.org)
  repository_dispatch:
    types: [run-bot]

jobs:
  fetch-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SLACK_CHANNEL_EMAIL: ${{ secrets.SLACK_CHANNEL_EMAIL }}
        run: python main.py
